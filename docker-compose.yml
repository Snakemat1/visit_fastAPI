services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: visit
      POSTGRES_USER: snkmt
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snkmt -d visit"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://snkmt:secret@db:5432/visit

volumes:
  postgres_data: